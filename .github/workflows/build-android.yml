name: Build IN THE VOID APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        # --legacy-peer-deps: @capacitor-community/file-opener (used by the
        # "open with another app" PDF feature) currently publishes a peer
        # dependency on an older Capacitor major version; the plugin itself
        # works fine on Capacitor 7, only its declared peer range is behind.
        run: npm install --legacy-peer-deps

      - name: Prepare web bundle
        run: npm run build:web

      - name: Place google-services.json
        run: cp google-services.json android/app/google-services.json

      # The android/ project (icons, splash theme, signing config,
      # AndroidManifest, MainActivity, ...) is committed to this repo on
      # purpose so those customizations survive every build. `cap add`
      # would overwrite all of it with a blank template, so it only ever
      # runs the very first time the folder doesn't exist yet; every
      # normal run just syncs the web bundle + Capacitor plugin list into
      # the existing project.
      - name: Add Android platform (first run only)
        run: |
          if [ ! -f "android/app/build.gradle" ]; then
            npx cap add android
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # No Gradle wrapper is committed (its binary launcher jar can't be
      # produced/verified in this environment), so Gradle itself is
      # provisioned by this official action instead of ./gradlew. Version
      # must satisfy Android Gradle Plugin 8.7.x's minimum (Gradle 8.9+).
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compute versionCode/versionName
        id: ver
        working-directory: android/app
        run: |
          CODE=$(grep -oP 'versionCode\s+\K[0-9]+' build.gradle)
          NAME=$(grep -oP 'versionName\s+"\K[^"]+' build.gradle)
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "Building versionCode=$CODE versionName=$NAME"

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: IN_THE_VOID-v${{ steps.ver.outputs.name }}-${{ steps.ver.outputs.code }}
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # Optional: when this run was triggered by pushing a tag (e.g. "v1.1.0"),
      # also publish the APK as a GitHub Release attachment.
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
