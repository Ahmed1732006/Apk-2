apply plugin: 'com.android.application'
apply plugin: 'com.google.gms.google-services'

android {
    namespace "com.inthevoid.platform"
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        // ─────────────────────────────────────────────────────────────
        // DO NOT change applicationId. Devices already have this app
        // installed under com.inthevoid.platform — changing it would
        // make Android treat every future build as a brand new,
        // unrelated app instead of an update.
        // ─────────────────────────────────────────────────────────────
        applicationId "com.inthevoid.platform"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion

        // The APK currently installed on devices is versionCode 1 /
        // versionName "1.0". versionCode MUST go up on every release
        // that should be installable as an update; versionName is the
        // human-readable label. Bump both together for the next release.
        versionCode 2
        versionName "1.1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files that are already compressed (Firebase/Capacitor assets)
             // don't need to be re-compressed into the APK.
             ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    signingConfigs {
        // Every build — CI or local — must be signed with this SAME
        // checked-in keystore (android-debug.keystore at the project
        // root) so a new APK installs as an UPDATE over whatever is
        // already on a device, instead of forcing an uninstall.
        //
        // ⚠️ One-time caveat: the copy of the app already live on
        // devices today was signed with a throwaway, unrecoverable
        // debug key (a different one, generated by a previous ephemeral
        // CI run) — NOT this keystore. That means THIS specific release
        // still requires uninstalling the old copy once. From this
        // release onward, every build reuses this same keystore, so all
        // FUTURE releases will install cleanly as updates over each
        // other. See CHANGES_README_AR.md for the full explanation.
        debug {
            storeFile file("${rootProject.projectDir}/../android-debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // No permanent release keystore has been provided yet, so
            // release builds are signed with the same debug keystore for
            // now (keeps update-compatibility with the debug builds this
            // workflow produces). Swap this for a real release
            // signingConfig before ever publishing outside of internal
            // testing/distribution.
            signingConfig signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')

    // Firebase Cloud Messaging (used by @capacitor/push-notifications +
    // @capacitor-community/fcm for real Android push notifications).
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-messaging'
}

apply from: 'capacitor.build.gradle'
